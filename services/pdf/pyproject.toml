[project]
name = "seerah-pdf"
version = "0.0.0"
description = "Seerah PDF service — Chromium (Playwright) + WeasyPrint fallback rendering."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27",
  "supabase>=2.29.0",
  "playwright>=1.49.0",
  "weasyprint>=63.1",
  "pillow>=11.0.0",
  "sentry-sdk[fastapi]>=2.19.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.4",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "mypy>=1.14.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seerah_pdf*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
