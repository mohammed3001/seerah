name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.1"
  PNPM_VERSION: "9.15.1"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # JS / TS — web, admin, and shared packages
  # ---------------------------------------------------------------------------
  js:
    name: JS — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: "Seerah"

  # ---------------------------------------------------------------------------
  # Python — AI service
  # ---------------------------------------------------------------------------
  ai-service:
    name: AI service — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Python — PDF service
  # ---------------------------------------------------------------------------
  pdf-service:
    name: PDF service — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: System deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Supabase — verify migrations apply cleanly to a fresh Postgres
  # ---------------------------------------------------------------------------
  supabase-migrations:
    name: Supabase — apply migrations to fresh Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Bootstrap auth + storage schemas (mocked for CI)
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/bootstrap_supabase_schemas.sql

      - name: Apply public migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify tables exist
        run: |
          psql -v ON_ERROR_STOP=1 -c "select table_name from information_schema.tables where table_schema='public' order by table_name;"

  # ---------------------------------------------------------------------------
  # Flutter — only when apps/mobile changes
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if git diff --quiet "$base" "$head" -- apps/mobile/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: subosito/flutter-action@v2
        if: steps.filter.outputs.changed == 'true'
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Pub get
        if: steps.filter.outputs.changed == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.filter.outputs.changed == 'true'
        run: flutter analyze

      - name: Test
        if: steps.filter.outputs.changed == 'true'
        run: flutter test
