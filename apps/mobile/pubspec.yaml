name: seerah_mobile
description: Seerah mobile app — Flutter client for the AI-powered resume builder.
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ------- State management -------------------------------------------------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ------- Routing ---------------------------------------------------------
  go_router: ^14.8.1

  # ------- Networking ------------------------------------------------------
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # ------- Auth / DB -------------------------------------------------------
  supabase_flutter: ^2.8.4

  # ------- Local storage ---------------------------------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # ------- UI / animation --------------------------------------------------
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  lottie: ^3.3.0

  # ------- Platform integrations -------------------------------------------
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  flutter_pdfview: ^1.4.0+1
  local_auth: ^2.3.0

  # ------- Models / serialization ------------------------------------------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ------- Utilities -------------------------------------------------------
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  generate: true
