pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.7+ is required because the androidx.core 1.16.0 artifact (pulled
    // transitively by recent androidx.lifecycle/biometric updates) gates its
    // AAR metadata on AGP 8.6+.  Trying to build on AGP 8.1 fails with:
    //   "Dependency 'androidx.core:core:1.16.0' requires Android Gradle plugin
    //    8.6.0 or higher."
    // 8.7.0 is the latest stable as of late 2024 and works with JDK 17.
    id "com.android.application" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
